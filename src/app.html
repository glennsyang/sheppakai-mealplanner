<!doctype html>
<html lang="en" data-theme="pine">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Pre-paint dark-mode class, mirroring mode-watcher's setInitialMode. <ModeWatcher>'s own
		     head script can't carry the CSP nonce, so it's disabled and this nonced copy runs instead. -->
		<script nonce="%sveltekit.nonce%">
			const mode = localStorage.getItem('color-scheme') ?? 'system';
			const dark =
				mode === 'dark' ||
				(mode === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
			document.documentElement.classList.toggle('dark', dark);
			document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" href="/favicon.ico" sizes="any" type="image/x-icon" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="theme-color" content="#1e2035" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-surface-50-950 text-surface-950-50">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
