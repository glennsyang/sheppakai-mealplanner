<!doctype html>
<html lang="en" data-theme="fridge">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Pre-paint dark-mode class, mirroring mode-watcher's setInitialMode. <ModeWatcher>'s own
		     head script can't carry the CSP nonce, so it's disabled and this nonced copy runs instead. -->
		<script nonce="%sveltekit.nonce%">
			const mode = localStorage.getItem('color-scheme') ?? 'system';
			const dark =
				mode === 'dark' ||
				(mode === 'system' && !window.matchMedia('(prefers-color-scheme: light)').matches);
			document.documentElement.classList.toggle('dark', dark);
			document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..800;1,400&family=Shantell+Sans:wght,BNCE,INFM@400..700,0,60&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" href="/favicon.ico" sizes="any" type="image/x-icon" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
