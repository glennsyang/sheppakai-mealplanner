app = "sheppakai-mealplanner"
primary_region = "yyz"

[build]

[[mounts]]
  source = "data"
  destination = "/data"
  
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"     # How long to wait for the app to start
    interval = "60s"       # How often to check
    method = "get"
    path = "/api/healthz"  # The URL we created above
    timeout = "5s"         # Max time allowed for a response

[processes]
  app = "./start.sh"
  
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
