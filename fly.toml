app = "meal-planner"
primary_region = "yyz"

[build]

[[mounts]]
  source = "data"
  destination = "/data"
  
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
