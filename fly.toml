app = "sheppakai-mealplanner"
primary_region = "yyz"

[build]

[[mounts]]
  source = "data"
  destination = "/data"
  
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = '1m0s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/api/healthz'

[processes]
  app = "./start.sh"
  
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
