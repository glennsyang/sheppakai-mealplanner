# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install dependencies
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # Run security audit
      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=high

      - name: Setup environment for type checking
        run: cp .env.example .env

      # Run linting
      - name: Run Ox lint
        run: npm run lint

      # Run type checking
      - name: Run Svelte check
        run: npm run check

      # Run tests
      - name: Run tests
        run: npm run test

      # Deploy only if all checks pass
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master (post-1.5, node24)

      - name: Deploy to Fly.io
        run: >
          flyctl deploy --remote-only
          --build-secret SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
